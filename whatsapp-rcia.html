<body>
<!-- Google Tag Manager (noscript) -->

<div class="box">
  <div class="logo">Mutual Cosecha Salud</div>
  <p>Tocá el botón para escribirnos por WhatsApp y cotizar tu plan.</p>
  <a id="waLink" class="cta" href="#">💬 Escribinos por WhatsApp</a>
  <small>Si tu navegador lo permite, te vamos a redirigir automáticamente.</small>
</div>
 
<script>
  // Reparto entre 3 numeros de la delegacion Resistencia.
  // No hay dato de localidad (viene directo de un anuncio con boton "Enviar WhatsApp"
  // reemplazado por esta pagina puente), asi que se reparte al azar, en partes iguales.
  var numeros = [
    "5493624058011", // Meli
    "5493624616535", // Fabi
    "5493624000878"  // Vale
  ];
  var elegido = numeros[Math.floor(Math.random() * numeros.length)];
 
  var mensaje = "Hola! Vi el anuncio de Mutual Cosecha Salud y quiero cotizar mi plan de salud.";
  var url = "https://wa.me/" + elegido + "?text=" + encodeURIComponent(mensaje);
 
  // dataLayer para GA4: registra que alguien llego a esta pagina puente
  // y a que numero fue derivado.
  window.dataLayer = window.dataLayer || [];
  dataLayer.push({ event: "whatsapp_redirect", numero_destino: elegido });
 
  document.getElementById("waLink").href = url;
 
  // Registro en Sheets (pestana "WhatsApp Directo"), en paralelo y sin bloquear
  // ni demorar la redireccion a WhatsApp. Si falla por cualquier motivo
  // (red, CORS, lo que sea), no pasa nada: el boton/redireccion de arriba
  // ya funcionan de forma independiente de esto.
  try {
    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxwWf-AhYeVCXy7KfPVeL2z5fH6si795Ft_Zk1_6kwaPpScJl7T9Du9DiftIASIdv2WbQ/exec";
    var nombresAsesoras = {
      "5493624058011": "Meli",
      "5493624616535": "Fabi",
      "5493624000878": "Vale"
    };
    fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        tipo: "whatsapp_click",
        asesora: nombresAsesoras[elegido] || "",
        numero: elegido,
        pagina: location.href,
        referrer: document.referrer || ""
      }),
      keepalive: true
    }).catch(function (err) { /* silencioso: nunca debe afectar la redireccion */ });
  } catch (err) { /* silencioso */ }
 
  // Intento de redireccion automatica (funciona en Android y navegadores
  // completos como Safari/Chrome). En el navegador interno de Instagram
  // en iOS puede no dispararse solo -- por eso el boton de arriba ya esta
  // visible y funcional desde el primer instante, no como respaldo escondido.
  setTimeout(function () {
    window.location.href = url;
  }, 600);
</script>
